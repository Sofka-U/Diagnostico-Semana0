name: CI - usuario-service

on:
  push:
    branches: ['main', 'develop', 'feature/**']
    paths:
      - 'Backend/usuario-service/**'
      - '.github/workflows/usuario-service-ci.yml'
  pull_request:
    branches: ['main', 'develop', 'feature/**']
    paths:
      - 'Backend/usuario-service/**'
      - '.github/workflows/usuario-service-ci.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Test usuario-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('Backend/usuario-service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and run tests
        working-directory: Backend/usuario-service
        run: mvn -B -DskipTests=false verify

      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: usuario-service-test-reports
          path: |
            Backend/usuario-service/target/surefire-reports/
            Backend/usuario-service/target/failsafe-reports/
            Backend/usuario-service/target/site/jacoco/

